# Site estático: nada para compilar, o Netlify publica a pasta como está.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# As imagens também mantêm o nome entre deploys (arthur.jpg, og.jpg...), então
# "immutable" por um ano prenderia uma foto trocada no cache do visitante.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# CSS e JS NÃO podem ter cache longo: o site não tem build, então os arquivos
# mantêm o mesmo nome a cada deploy. Com max-age alto, quem já visitou recebe
# HTML novo com CSS velho (layout quebrado) até o cache expirar.
# Com must-revalidate o navegador confere o ETag e recebe 304 quando nada mudou.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

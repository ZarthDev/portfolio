<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mensagem enviada — Arthur Martins</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&family=Inter:wght@300;400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .thanks{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
          text-align:center;padding:40px var(--pad);gap:28px;position:relative;overflow:hidden}
  .thanks__glow{position:absolute;inset:auto;top:50%;left:50%;transform:translate(-50%,-50%);
                width:120vw;height:90vh;pointer-events:none;
                background:radial-gradient(42% 38% at 50% 50%, rgba(142,14,34,.4), transparent 70%);filter:blur(20px)}
  .thanks>*:not(.thanks__glow){position:relative;z-index:2}
  .thanks h1{font-family:var(--f-display);font-weight:900;font-size:clamp(44px,11vw,140px);
             line-height:.88;letter-spacing:-.05em;text-transform:uppercase}
  .thanks p{color:var(--grey);max-width:46ch}
  .thanks .btn{align-self:center}
</style>
</head>
<body class="is-ready">
  <section class="thanks">
    <div class="thanks__glow" aria-hidden="true"></div>
    <span class="tag"><i>✳</i> Mensagem recebida</span>
    <h1>Obrigado!<br><span style="-webkit-text-stroke:2px var(--white);color:transparent">Já chegou</span></h1>
    <p>Sua mensagem caiu direto na minha caixa. Costumo responder em até um dia útil — enquanto isso, sinta-se à vontade para dar mais uma volta pelo portfólio.</p>
    <a href="/" class="btn" data-magnet>Voltar ao início <i>→</i></a>
  </section>
  <script src="js/main.js" defer></script>
</body>
</html>
